<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Multi-Sport Live Ticker</title>
<style>
  :root{
    --bg:#0a0f15;
    --panel:#111923;
    --panel2:#0d141c;
    --line:#2a3440;
    --text:#f7f8fa;
    --muted:#a8b3bf;
    --accent:#d92332;
    --live:#ff4e55;
    --h:128px;
    --speed:90s;
    --brand-a:#17375c;
    --brand-b:#b21f35;
    --badge-a:#17375c;
    --badge-b:#b21f35;
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
  }

  .ticker{
    height:var(--h);
    width:100%;
    display:flex;
    background:linear-gradient(180deg,#101720 0%,#0a1016 100%);
    border-top:1px solid #33404e;
    border-bottom:1px solid #06090d;
    color:var(--text);
    overflow:hidden;
  }

  .brand{
    width:124px;
    flex:0 0 124px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,var(--brand-a) 0%,var(--brand-a) 48%,var(--brand-b) 49%,var(--brand-b) 100%);
    border-right:1px solid rgba(255,255,255,.14);
    z-index:4;
    overflow:hidden;
    transition:background .5s ease, opacity .35s ease, transform .35s ease, filter .35s ease;
  }

  .brand-mark{
    display:none;
  }

  .brand-inner{
    width:100%;
    height:100%;
    padding:8px 8px 48px;
    text-align:center;
    line-height:1;
    z-index:1;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:6px;
  }
  .brand-logo{
    width:52px;
    height:52px;
    object-fit:contain;
    margin:0 0 2px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));
  }
  .brand-logo.hidden{
    display:none;
  }
  .brand-title{
    font-weight:900;
    font-size:20px;
    letter-spacing:-1px;
    margin:0;
  }
  .brand-sub{
    margin:1px 0 0;
    padding-bottom:4px;
    font-size:8px;
    font-weight:800;
    letter-spacing:1.6px;
  }
  .brand-next{
    position:absolute;
    left:-8px;
    right:-8px;
    bottom:0;
    height:38px;
    padding:0 8px;
    border-top:3px solid rgba(255,255,255,.9);
    background:linear-gradient(180deg,#0a0f16 0%, #111923 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    font-size:8px;
    line-height:1.05;
    font-weight:900;
    letter-spacing:.7px;
    color:#eaf2fb;
    opacity:1;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .brand-next .next-label{
    display:block;
    font-size:7px;
    letter-spacing:1.2px;
    color:#ffb2b4;
    margin:0 0 2px 0;
  }
  .brand-next .next-sport{
    display:block;
    font-size:11px;
    line-height:1;
    letter-spacing:.6px;
    color:#ffffff;
  }

  .viewport{
    min-width:0;
    flex:1;
    overflow:hidden;
    position:relative;
    transition:opacity .35s ease, transform .35s ease, filter .35s ease;
  }


  .track{
    height:100%;
    display:flex;
    width:max-content;
    will-change:transform;
    animation:scroll var(--speed) linear infinite;
  }
  .group{display:flex;height:100%}

  @keyframes scroll{
    from{transform:translateX(0)}
    to{transform:translateX(-50%)}
  }

  .switching-out .brand,
  .switching-out .viewport{
    opacity:.1;
    transform:translateY(6px);
    filter:blur(2px);
  }

  .switching-in .brand,
  .switching-in .viewport{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }

  .item{
    height:100%;
    flex:0 0 auto;
    border-right:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
  }

  .score{
    width:300px;
    padding:10px 12px 8px;
    display:grid;
    grid-template-rows:34px 34px 24px;
    row-gap:2px;
  }

  .team-row{
    display:grid;
    grid-template-columns:30px 48px 1fr 38px;
    align-items:center;
    gap:7px;
    min-height:34px;
  }

  .logo{
    width:28px;
    height:28px;
    object-fit:contain;
  }

  .abbr{
    font-weight:900;
    font-size:19px;
    line-height:1;
  }

  .record{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }

  .runs{
    font-size:23px;
    font-weight:900;
    text-align:right;
    line-height:1;
  }

  .game-meta{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px;
    border-top:1px solid #222c37;
    padding-top:4px;
    font-size:10px;
    line-height:1;
    font-weight:800;
    color:#cad3dd;
    letter-spacing:.45px;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
  }

  .game-meta span:last-child{
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .live-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--live);
    box-shadow:0 0 6px rgba(255,78,85,.85);
    display:inline-block;
    margin-right:5px;
    vertical-align:1px;
  }

  .status-live{color:#ff8589}
  .status-final{color:#d0d8e1}
  .status-upcoming{color:#8cb9ff}

  .news{
    width:540px;
    padding:12px 18px 11px;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    background:linear-gradient(180deg,#121a23 0%,#0c131b 100%);
  }

  .news-kicker{
    flex:0 0 auto;
    color:#f07e85;
    font-weight:900;
    font-size:11px;
    line-height:16px;
    letter-spacing:1.5px;
    margin:0 0 5px 0;
  }

  .news-head{
    flex:0 0 auto;
    font-size:18px;
    line-height:23px;
    font-weight:800;
    margin:0;
    padding:0 0 3px 0;
    min-height:49px;
    max-height:49px;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .news-source{
    flex:0 0 auto;
    margin-top:auto;
    color:var(--muted);
    font-size:10px;
    line-height:14px;
    font-weight:700;
    padding-top:2px;
  }

  .leaders{
    width:360px;
    padding:8px 14px 8px;
    display:grid;
    grid-template-rows:20px 22px 22px 22px 18px;
    row-gap:1px;
  }
  .leader-title{
    font-size:11px;
    line-height:20px;
    font-weight:900;
    color:#dce4ec;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .leader-row{
    display:grid;
    grid-template-columns:22px 26px 1fr 54px;
    align-items:center;
    gap:6px;
    min-height:22px;
  }
  .leader-pos{
    font-size:12px;
    font-weight:900;
    color:#9fb0c1;
  }
  .leader-logo{
    width:21px;
    height:21px;
  }
  .leader-name{
    font-size:14px;
    line-height:1;
    font-weight:850;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .leader-score{
    font-size:13px;
    font-weight:900;
    text-align:right;
  }
  .leader-status{
    border-top:1px solid #222c37;
    padding-top:3px;
    font-size:10px;
    line-height:15px;
    font-weight:900;
    letter-spacing:.4px;
    text-transform:uppercase;
  }
  .event-card{
    width:380px;
    padding:16px 18px 12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .event-kicker{
    color:#f07e85;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.4px;
    margin-bottom:6px;
  }
  .event-name{
    font-size:18px;
    font-weight:850;
    line-height:22px;
    max-height:44px;
    overflow:hidden;
  }
  .event-status{
    margin-top:6px;
    color:#9fb0c1;
    font-size:10px;
    font-weight:900;
  }

  .empty,.error{
    display:flex;
    align-items:center;
    padding:0 20px;
    font-weight:800;
  }
  .empty{width:520px;font-size:18px;color:#d5dde6}
  .error{width:600px;font-size:15px;color:#ffd1d1}
</style>
</head>
<body>
<div class="ticker">
  <div class="brand" id="brand">
    <div class="brand-mark" id="brandMark">MLB</div>
    <div class="brand-inner">
      <img class="brand-logo" id="brandLogo" alt="">
      <div class="brand-title" id="brandTitle">MLB</div>
      <div class="brand-sub" id="brandSub">LIVE TICKER</div>
      <div class="brand-next" id="brandNext">UP NEXT: NFL</div>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div class="track" id="track">
      <div class="group" id="groupA"></div>
      <div class="group" id="groupB"></div>
    </div>
  </div>
</div>

<script>
const SPORT_SECONDS = 24;
const SWITCH_ANIM_MS = 420;
const SCORE_REFRESH_MS = 30000;
const NEWS_REFRESH_MS = 180000;
const MAX_NEWS_ITEMS = 5;

const SPORTS = [
  { key:'mlb',   label:'MLB',   sport:'baseball',   league:'mlb',                     kind:'team',   colorA:'#17375c', colorB:'#b21f35', mark:'MLB',  logo:'https://a.espncdn.com/i/teamlogos/leagues/500/mlb.png' },
  { key:'nfl',   label:'NFL',   sport:'football',   league:'nfl',                     kind:'team',   colorA:'#1c4f7f', colorB:'#d74d43', mark:'NFL',  logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png' },
  { key:'nba',   label:'NBA',   sport:'basketball', league:'nba',                     kind:'team',   colorA:'#17408b', colorB:'#c9082a', mark:'NBA',  logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nba.png' },
  { key:'nhl',   label:'NHL',   sport:'hockey',     league:'nhl',                     kind:'team',   colorA:'#2b2b2b', colorB:'#8d99a6', mark:'NHL',  logo:'https://a.espncdn.com/i/teamlogos/leagues/500/nhl.png' },
  { key:'ncaaf', label:'NCAAF', sport:'football',   league:'college-football',        kind:'team',   colorA:'#0d4d8b', colorB:'#1e8f64', mark:'CFB',  logo:'' },
  { key:'ncaam', label:'NCAAM', sport:'basketball', league:'mens-college-basketball', kind:'team',   colorA:'#214cce', colorB:'#f37021', mark:'CBB',  logo:'' },
  { key:'wnba',  label:'WNBA',  sport:'basketball', league:'wnba',                    kind:'team',   colorA:'#4e2f7f', colorB:'#f07d00', mark:'WNBA', logo:'https://a.espncdn.com/i/teamlogos/leagues/500/wnba.png' },
  { key:'mls',   label:'MLS',   sport:'soccer',     league:'usa.1',                   kind:'team',   colorA:'#111111', colorB:'#6d7f95', mark:'MLS',  logo:'' },
  { key:'pga',   label:'GOLF',  sport:'golf',       league:'pga',                     kind:'leader', colorA:'#1d5f31', colorB:'#c6a44b', mark:'PGA',  logo:'' },
  { key:'f1',    label:'F1',    sport:'racing',     league:'f1',                      kind:'leader', colorA:'#111111', colorB:'#e10600', mark:'F1',   logo:'' }
];

let sportIndex = 0;
let currentSport = SPORTS[0];
let sportData = {};
let switching = false;

const tickerEl = document.querySelector('.ticker');
const brandTitleEl = document.getElementById('brandTitle');
const brandSubEl = document.getElementById('brandSub');
const brandMarkEl = document.getElementById('brandMark');
const brandLogoEl = document.getElementById('brandLogo');
const brandNextEl = document.getElementById('brandNext');

const esc = (s='') => String(s)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;");

function ensureStore(key){
  if(!sportData[key]){
    sportData[key] = { games:[], headlines:[], lastScore:0, lastNews:0 };
  }
  return sportData[key];
}

function apiBase(s){
  return `https://site.api.espn.com/apis/site/v2/sports/${s.sport}/${s.league}`;
}

function getNextSport(){
  return SPORTS[(sportIndex + 1) % SPORTS.length];
}

function setTheme(s){
  document.documentElement.style.setProperty('--brand-a', s.colorA);
  document.documentElement.style.setProperty('--brand-b', s.colorB);
  document.documentElement.style.setProperty('--badge-a', s.colorA);
  document.documentElement.style.setProperty('--badge-b', s.colorB);
  brandTitleEl.textContent = s.label;
  brandSubEl.textContent = 'LIVE TICKER';
  brandMarkEl.textContent = s.mark || s.label;

  // Only show league logos we explicitly trust. If one ever fails, hide it cleanly.
  brandLogoEl.onerror = () => {
    brandLogoEl.classList.add('hidden');
    brandLogoEl.removeAttribute('src');
  };

  if(s.logo){
    brandLogoEl.classList.remove('hidden');
    brandLogoEl.alt = `${s.label} logo`;
    brandLogoEl.src = s.logo;
  } else {
    brandLogoEl.classList.add('hidden');
    brandLogoEl.removeAttribute('src');
    brandLogoEl.alt = '';
  }
}

function updateNextBadge(){
  const nextSport = getNextSport();
  brandNextEl.innerHTML = `<span class="next-label">UP NEXT</span><span class="next-sport">${esc(nextSport.label)}</span>`;
}

function formatRecord(team){
  return team?.records?.[0]?.summary || '';
}

function eventStatus(comp){
  const st = comp?.status?.type || {};
  const detail = st.shortDetail || st.detail || '';
  const state = st.state || '';
  if(state === 'in') return {text: detail || 'LIVE', cls:'status-live', live:true};
  if(state === 'post') return {text: detail || 'FINAL', cls:'status-final', live:false};
  return {text: detail || 'UPCOMING', cls:'status-upcoming', live:false};
}

function scoreCard(event){
  const comp = event?.competitions?.[0];
  if(!comp) return '';

  const teams = [...(comp.competitors || [])].sort((a,b)=>{
    const ao = a.homeAway === 'away' ? 0 : 1;
    const bo = b.homeAway === 'away' ? 0 : 1;
    return ao - bo;
  });

  if(teams.length < 2) return '';

  const meta = eventStatus(comp);
  const venue = comp?.venue?.fullName || event?.season?.slug || '';

  const rows = teams.slice(0,2).map(t=>{
    const team = t.team || {};
    const logo = team.logo || team.logos?.[0]?.href || '';
    const abbr = team.abbreviation || team.shortDisplayName || team.displayName || '';
    const score = t.score ?? '-';
    return `
      <div class="team-row">
        <img class="logo" src="${esc(logo)}" alt="">
        <div class="abbr">${esc(abbr)}</div>
        <div class="record">${esc(formatRecord(t))}</div>
        <div class="runs">${esc(score)}</div>
      </div>`;
  }).join('');

  return `
    <div class="item score">
      ${rows}
      <div class="game-meta">
        <span class="${meta.cls}">${meta.live ? '<span class="live-dot"></span>' : ''}${esc(meta.text)}</span>
        <span>${esc(venue)}</span>
      </div>
    </div>`;
}

function leaderCard(event, sport){
  const comp = event?.competitions?.[0];
  const competitors = comp?.competitors || [];
  const status = eventStatus(comp);
  const eventName = event?.shortName || event?.name || comp?.shortName || sport.label;

  let rows = competitors.slice(0,3).map((c, idx)=>{
    const athlete = c.athlete || c.driver || {};
    const name = athlete.shortName || athlete.displayName || c.displayName || c.team?.displayName || `#${idx+1}`;
    const logo = athlete.flag?.href || c.team?.logo || c.team?.logos?.[0]?.href || '';
    const pos = c.order || c.place || c.position || (idx+1);
    const score = c.score ?? c.stats?.find(x=>x.name==='score')?.displayValue ?? '';
    return `
      <div class="leader-row">
        <div class="leader-pos">${esc(pos)}</div>
        ${logo ? `<img class="logo leader-logo" src="${esc(logo)}" alt="">` : `<div></div>`}
        <div class="leader-name">${esc(name)}</div>
        <div class="leader-score">${esc(score)}</div>
      </div>`;
  }).join('');

  if(!rows){
    return `
      <div class="item event-card">
        <div class="event-kicker">${esc(sport.label)}</div>
        <div class="event-name">${esc(eventName)}</div>
        <div class="event-status">${esc(status.text)}</div>
      </div>`;
  }

  return `
    <div class="item leaders">
      <div class="leader-title">${esc(eventName)}</div>
      ${rows}
      <div class="leader-status ${status.cls}">${status.live ? '<span class="live-dot"></span>' : ''}${esc(status.text)}</div>
    </div>`;
}

function newsCard(article, label){
  const head = article?.headline || article?.title || '';
  if(!head) return '';
  const source = article?.source || 'ESPN';
  return `
    <div class="item news">
      <div class="news-kicker">${esc(label)} NEWS</div>
      <div class="news-head">${esc(head)}</div>
      <div class="news-source">${esc(source)}</div>
    </div>`;
}

function composeItems(sport){
  const store = ensureStore(sport.key);
  const games = store.games || [];
  const headlines = store.headlines || [];
  const items = [];

  if(games.length){
    games.forEach((g, i)=>{
      items.push(sport.kind === 'leader' ? leaderCard(g, sport) : scoreCard(g));
      if((i+1) % 3 === 0 && headlines.length){
        const h = headlines[Math.floor(i/3) % headlines.length];
        items.push(newsCard(h, sport.label));
      }
    });
  }

  if(!games.length && headlines.length){
    headlines.slice(0,3).forEach(h=>items.push(newsCard(h, sport.label)));
  }

  if(!games.length && !headlines.length){
    items.push(`<div class="item empty">No current ${esc(sport.label)} events or headlines available.</div>`);
  } else if(headlines.length){
    const alreadyInserted = Math.floor(games.length / 3);
    headlines.slice(alreadyInserted, alreadyInserted + 2)
      .forEach(h=>items.push(newsCard(h, sport.label)));
  }

  return items.filter(Boolean).join('');
}

function renderForSport(sport){
  const a = document.getElementById('groupA');
  const b = document.getElementById('groupB');
  const html = composeItems(sport);
  a.innerHTML = html;
  b.innerHTML = html;

  requestAnimationFrame(()=>{
    const width = a.scrollWidth;
    const pxPerSecond = 72;
    const seconds = Math.max(35, width / pxPerSecond);
    document.documentElement.style.setProperty('--speed', `${seconds}s`);

    const track = document.getElementById('track');
    track.style.animation = 'none';
    void track.offsetWidth;
    track.style.animation = `scroll ${seconds}s linear infinite`;
  });
}

async function loadScoresFor(sport){
  const store = ensureStore(sport.key);
  try{
    const r = await fetch(`${apiBase(sport)}/scoreboard?_=${Date.now()}`, {cache:'no-store'});
    if(!r.ok) throw new Error(`Scoreboard HTTP ${r.status}`);
    const data = await r.json();
    store.games = data?.events || [];
    store.lastScore = Date.now();
    if(sport.key === currentSport.key) renderForSport(currentSport);
  }catch(err){
    console.error(err);
    store.games = store.games || [];
    if(sport.key === currentSport.key) renderForSport(currentSport);
  }
}

async function loadNewsFor(sport){
  const store = ensureStore(sport.key);
  try{
    const r = await fetch(`${apiBase(sport)}/news?limit=8&_=${Date.now()}`, {cache:'no-store'});
    if(!r.ok) throw new Error(`News HTTP ${r.status}`);
    const data = await r.json();
    store.headlines = (data?.articles || []).slice(0, MAX_NEWS_ITEMS);
    store.lastNews = Date.now();
    if(sport.key === currentSport.key) renderForSport(currentSport);
  }catch(err){
    console.error(err);
    store.headlines = store.headlines || [];
    if(sport.key === currentSport.key) renderForSport(currentSport);
  }
}

function prefetchSport(sport){
  const store = ensureStore(sport.key);
  const now = Date.now();
  if(now - store.lastScore > SCORE_REFRESH_MS) loadScoresFor(sport);
  if(now - store.lastNews > NEWS_REFRESH_MS) loadNewsFor(sport);
}

async function switchToNextSport(){
  if(switching) return;
  switching = true;

  const nextSport = getNextSport();
  prefetchSport(nextSport);

  tickerEl.classList.remove('switching-in');
  tickerEl.classList.add('switching-out');

  await new Promise(r => setTimeout(r, SWITCH_ANIM_MS));

  sportIndex = (sportIndex + 1) % SPORTS.length;
  currentSport = SPORTS[sportIndex];
  setTheme(currentSport);
  updateNextBadge();
  renderForSport(currentSport);
  prefetchSport(currentSport);

  tickerEl.classList.remove('switching-out');
  tickerEl.classList.add('switching-in');

  setTimeout(()=>{
    tickerEl.classList.remove('switching-in');
    switching = false;
  }, SWITCH_ANIM_MS + 80);
}

function refreshLoop(){
  prefetchSport(currentSport);
  prefetchSport(getNextSport());
}

function init(){
  ensureStore(currentSport.key);
  setTheme(currentSport);
  updateNextBadge();
  renderForSport(currentSport);
  prefetchSport(currentSport);
  prefetchSport(getNextSport());
  setInterval(refreshLoop, 5000);
  setInterval(switchToNextSport, SPORT_SECONDS * 1000);
}

init();
</script>
</body>
</html>
